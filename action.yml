name: SST Preview Action
description: Deploy SST preview environments and post PR comments

branding:
  icon: cloud
  color: orange

inputs:
  working-directory:
    description: "Directory containing sst.config"
    required: false
    default: "."
  operation:
    description: "Operation to run: auto, deploy, remove, unlock, or reconcile"
    required: false
    default: "auto"
  pr-number:
    description: "Pull request number for manual disambiguation, cleanup, or stale-lock unlock"
    required: false
    default: ""
  target-branch:
    description: "Pull request branch to resolve for manual cleanup"
    required: false
    default: ""
  comment-enabled:
    description: "Whether to post PR comment (deploy only)"
    required: false
    default: "true"
  cleanup-on-deploy-failure:
    description: "Remove partially created resources when deploy fails"
    required: false
    default: "true"
  remove-max-attempts:
    description: "Maximum number of remove attempts"
    required: false
    default: "3"
  remove-retry-delay-seconds:
    description: "Delay between remove attempts in seconds"
    required: false
    default: "30"
  unlock-on-lock:
    description: "Automatically unlock a stage after a lock-specific remove failure"
    required: false
    default: "true"
  verify-removal:
    description: "Verify removal using SST state: auto, true, or false"
    required: false
    default: "auto"
  url-output-key:
    description: "Top-level SST output key containing the preview URL"
    required: false
    default: "url"

outputs:
  url:
    description: "Deployed preview URL"
    value: ${{ steps.sst.outputs.url }}
  operation:
    description: "Resolved operation"
    value: ${{ steps.sst.outputs.operation || steps.dispatch_pr.outputs.operation || steps.reconcile_inventory.outputs.operation }}
  stage:
    description: "SST stage acted on; empty for reconcile or a skipped deploy"
    value: ${{ steps.sst.outputs.stage || steps.reconcile_inventory.outputs.stage }}

runs:
  using: composite
  steps:
    - name: Remove pre-installed Pulumi
      if: runner.environment == 'github-hosted'
      shell: bash
      run: rm -f /usr/local/bin/pulumi*

    - name: Validate reconciliation event
      if: >-
        ${{
          inputs.operation == 'reconcile' &&
          github.event_name != 'schedule' &&
          github.event_name != 'workflow_dispatch'
        }}
      shell: bash
      run: |
        echo "::error::reconcile is supported only for schedule and workflow_dispatch events" >&2
        exit 1

    - name: Validate unlock event
      if: >-
        ${{
          inputs.operation == 'unlock' &&
          github.event_name != 'workflow_dispatch'
        }}
      shell: bash
      run: |
        echo "::error::unlock is supported only for workflow_dispatch events" >&2
        exit 1

    - name: Validate trusted dispatch ref
      if: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.operation == 'remove' ||
            inputs.operation == 'unlock' ||
            inputs.operation == 'reconcile'
          ) &&
          (
            github.ref_type != 'branch' ||
            github.ref_name != github.event.repository.default_branch
          )
        }}
      shell: bash
      run: |
        echo "::error::manual remove, unlock, and reconcile must run from the default branch" >&2
        exit 1

    - name: Resolve dispatch pull request
      id: dispatch_pr
      if: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          (
            inputs.operation == 'auto' ||
            inputs.operation == 'deploy' ||
            inputs.operation == 'remove'
          )
        }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        BASH_ENV: ""
        DISPATCH_GITHUB_API_URL: ${{ github.api_url }}
        DISPATCH_GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        DISPATCH_GITHUB_REF_NAME: ${{ github.ref_name }}
        DISPATCH_GITHUB_REF_TYPE: ${{ github.ref_type }}
        DISPATCH_GITHUB_REPOSITORY: ${{ github.repository }}
        DISPATCH_GITHUB_TOKEN: ${{ github.token }}
        DISPATCH_INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        DISPATCH_OPERATION: ${{ inputs.operation }}
        DISPATCH_TARGET_BRANCH: ${{ inputs.target-branch }}
        GH_TOKEN: ""
        GITHUB_TOKEN: ""
        NODE_OPTIONS: ""
        NODE_PATH: ""
      run: 'node "${{ github.action_path }}/scripts/resolve-dispatch-pull-request.mjs"'

    - name: Run SST
      id: sst
      if: >-
        ${{
          inputs.operation != 'reconcile' &&
          (inputs.operation != 'auto' || github.event_name != 'schedule') &&
          steps.dispatch_pr.outputs.skip != 'true'
        }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DISPATCH_GITHUB_TOKEN: ""
        INPUT_CLEANUP_ON_DEPLOY_FAILURE: ${{ inputs.cleanup-on-deploy-failure }}
        INPUT_OPERATION: ${{ inputs.operation }}
        INPUT_PR_NUMBER: ${{ steps.dispatch_pr.outputs.pr_number || inputs.pr-number }}
        INPUT_REMOVE_MAX_ATTEMPTS: ${{ inputs.remove-max-attempts }}
        INPUT_REMOVE_RETRY_DELAY_SECONDS: ${{ inputs.remove-retry-delay-seconds }}
        INPUT_UNLOCK_ON_LOCK: ${{ inputs.unlock-on-lock }}
        INPUT_URL_OUTPUT_KEY: ${{ inputs.url-output-key }}
        INPUT_VERIFY_REMOVAL: ${{ inputs.verify-removal }}
        PR_EVENT_ACTION: ${{ github.event.action }}
        PR_EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RECONCILE_GITHUB_TOKEN: ""
      run: '"${{ github.action_path }}/scripts/run-sst.sh"'

    - name: Discover reconciliation candidates
      id: reconcile_inventory
      if: >-
        ${{
          (
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
          ) &&
          (
            inputs.operation == 'reconcile' ||
            (inputs.operation == 'auto' && github.event_name == 'schedule')
          )
        }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DISPATCH_GITHUB_TOKEN: ""
        GH_TOKEN: ""
        GITHUB_TOKEN: ""
        INPUT_CLEANUP_ON_DEPLOY_FAILURE: ${{ inputs.cleanup-on-deploy-failure }}
        INPUT_OPERATION: ${{ inputs.operation }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_REMOVE_MAX_ATTEMPTS: ${{ inputs.remove-max-attempts }}
        INPUT_REMOVE_RETRY_DELAY_SECONDS: ${{ inputs.remove-retry-delay-seconds }}
        INPUT_URL_OUTPUT_KEY: ${{ inputs.url-output-key }}
        INPUT_VERIFY_REMOVAL: ${{ inputs.verify-removal }}
        PR_EVENT_ACTION: ${{ github.event.action }}
        PR_EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RECONCILE_GITHUB_TOKEN: ""
      run: '"${{ github.action_path }}/scripts/run-sst.sh"'

    - name: Plan reconciliation
      id: reconcile
      if: >-
        ${{
          (
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
          ) &&
          (
            inputs.operation == 'reconcile' ||
            (inputs.operation == 'auto' && github.event_name == 'schedule')
          )
        }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        BASH_ENV: ""
        GH_TOKEN: ""
        GITHUB_TOKEN: ""
        NODE_OPTIONS: ""
        NODE_PATH: ""
        RECONCILE_CANDIDATES_FILE: ${{ steps.reconcile_inventory.outputs.reconcile_candidates_file }}
        RECONCILE_GITHUB_API_URL: ${{ github.api_url }}
        RECONCILE_GITHUB_REPOSITORY: ${{ github.repository }}
        RECONCILE_GITHUB_TOKEN: ${{ github.token }}
      run: 'node "${{ github.action_path }}/scripts/plan-reconciliation.mjs"'

    - name: Remove reconciled stages
      if: >-
        ${{
          (
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
          ) &&
          (
            inputs.operation == 'reconcile' ||
            (inputs.operation == 'auto' && github.event_name == 'schedule')
          )
        }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DISPATCH_GITHUB_TOKEN: ""
        GH_TOKEN: ""
        GITHUB_TOKEN: ""
        INPUT_REMOVE_MAX_ATTEMPTS: ${{ inputs.remove-max-attempts }}
        INPUT_REMOVE_RETRY_DELAY_SECONDS: ${{ inputs.remove-retry-delay-seconds }}
        INPUT_UNLOCK_ON_LOCK: ${{ inputs.unlock-on-lock }}
        INPUT_VERIFY_REMOVAL: ${{ inputs.verify-removal }}
        RECONCILE_GITHUB_TOKEN: ""
        RECONCILE_PLAN_FILE: ${{ steps.reconcile.outputs.plan_file }}
      run: '"${{ github.action_path }}/scripts/remove-reconciled-stages.sh"'

    - name: Get short commit sha
      if: steps.sst.outputs.operation == 'deploy' && inputs.comment-enabled == 'true' && github.event_name == 'pull_request'
      id: meta
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: echo "short_sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      if: steps.sst.outputs.operation == 'deploy' && steps.sst.outputs.url != '' && inputs.comment-enabled == 'true' && github.event_name == 'pull_request'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      with:
        message: |
          **Preview Deployed to AWS via [SST](https://www.sst.dev/)**
          ---
          <table>
          <tr><td>Latest commit:</td><td><a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}"><code>${{ steps.meta.outputs.short_sha }}</code></a></td></tr>
          <tr><td>Status:</td><td>✅ Deploy successful!</td></tr>
          <tr><td>Preview URL:</td><td><a href="${{ steps.sst.outputs.url }}">${{ steps.sst.outputs.url }}</a></td></tr>
          </table>
          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View logs</a>
